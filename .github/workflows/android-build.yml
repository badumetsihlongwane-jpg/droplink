name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_note:
        description: "Optional note for this manual APK build"
        required: false
        default: "Manual release build"
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'protocol/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7 with caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Ensure Android SDK licenses accepted
        shell: bash
        run: |
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Run Android unit & DLSP/1 protocol tests
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: Build installable Android APKs (Release & Debug)
        working-directory: android
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Collect APK artifacts and checksums
        shell: bash
        run: |
          mkdir -p artifacts/apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/apk/DropLink-1.0.0-android.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/apk/DropLink-1.0.0-android-debug.apk
          (cd artifacts/apk && sha256sum DropLink-1.0.0-android.apk DropLink-1.0.0-android-debug.apk > SHA256SUMS.txt)
          ls -lh artifacts/apk
          cat artifacts/apk/SHA256SUMS.txt

      - name: Upload DropLink Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropLink-Android-APK
          path: |
            artifacts/apk/DropLink-1.0.0-android.apk
            artifacts/apk/DropLink-1.0.0-android-debug.apk
            artifacts/apk/SHA256SUMS.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload Android unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 30
          if-no-files-found: ignore

      - name: Write build summary
        shell: bash
        run: |
          {
            echo "## DropLink Android Build Succeeded"
            echo ""
            echo "- **Primary installable APK**: \`DropLink-1.0.0-android.apk\` (inside artifact \`DropLink-Android-APK\`)"
            echo "- **Debug APK**: \`DropLink-1.0.0-android-debug.apk\`"
            echo "- **Tests**: All Android unit & DLSP/1 protocol tests passed."
            echo ""
            echo "### SHA-256 Checksums"
            echo "\`\`\`"
            cat artifacts/apk/SHA256SUMS.txt
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
